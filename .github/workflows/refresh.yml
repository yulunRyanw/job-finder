name: Refresh job listings

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch:           # and on demand from the Actions tab

permissions:
  contents: write              # commit refreshed data
  issues: write                # post the new-jobs digest

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m pipeline.run

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "job-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs config/companies.yml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            git commit -m "chore: refresh listings ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post new-jobs digest
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s data/digest.md ]; then
            gh issue create \
              --title "New early-career roles — $(date -u +%Y-%m-%d)" \
              --body-file data/digest.md \
              --label "new-jobs" || echo "Issue creation skipped (label may not exist yet)."
          else
            echo "No new early-career postings this run."
          fi
